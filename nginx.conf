# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf  —  Load balancer for MEVA (5 Streamlit workers)
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/meva
#   sudo ln -s /etc/nginx/sites-available/meva /etc/nginx/sites-enabled/meva
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

upstream meva_backend {
    least_conn;   # route each new request to the least-busy worker

    server 127.0.0.1:8501;
    server 127.0.0.1:8502;
    server 127.0.0.1:8503;
    server 127.0.0.1:8504;
    server 127.0.0.1:8505;
}

server {
    listen 80;
    server_name _;   # replace _ with your domain name, e.g. meva.example.com

    # ── Proxy all traffic to a Streamlit worker ──────────────────────────────
    location / {
        proxy_pass         http://meva_backend;
        proxy_http_version 1.1;

        # Required for Streamlit's WebSocket (live updates)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeouts — allow up to 90 s for slow AI responses
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }

    # ── Health check endpoint (optional) ────────────────────────────────────
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
